name: Sync podcast episodes

on:
  schedule:
    - cron: '17 13 * * *'   # once a day
  workflow_dispatch:        # and any time from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-episodes.mjs
      - name: Commit catalogue changes
        run: |
          if [ -n "$(git status --porcelain episodes.js)" ]; then
            git config user.name "episode-sync"
            git config user.email "episode-sync@users.noreply.github.com"
            git add episodes.js
            git commit -m "Sync episodes from YouTube channel"
            git push
          else
            echo "Catalogue already up to date."
          fi
